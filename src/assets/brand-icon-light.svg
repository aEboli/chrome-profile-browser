<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Chromium Workbench brand icon</title>
  <desc id="desc">Minimal fingerprint with a star, moon, and sun</desc>
  <defs>
    <linearGradient id="brand-background-light" x1="18" y1="12" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbff" />
      <stop offset="1" stop-color="#dce9f8" />
    </linearGradient>
    <linearGradient id="fingerprint-stroke-light" x1="33" y1="38" x2="93" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24466f" />
      <stop offset="1" stop-color="#4776ae" />
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#brand-background-light)" stroke="#477db8" stroke-opacity=".55" stroke-width="2" />

